# Analisi statica del codice (CodeQL). Alert su Security > Code scanning.
# Triage settimanale: vedi PRC-security-alert-triage nel registro gtf
# (owner it@spaziogenesi.org, esecutore Federico Battisti) — voce A3 del
# piano P43, parte 2.

name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

# Default minimo esplicito: il job sotto lo sovrascrive già con lo stretto
# necessario, ma Scorecard vuole anche un default a livello di workflow
# (difesa in profondità per eventuali job futuri). Scorecard/A3-parte4.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:javascript-typescript"
