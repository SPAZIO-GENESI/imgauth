# OpenSSF Scorecard: valutazione automatica della postura di supply-chain
# security del repo (dipendenze pinnate, branch protection, code review,
# ecc.). Esecuzione schedulata + manuale; pubblica i risultati sull'API
# pubblica di Scorecard (api.securityscorecards.dev) e sulla scheda
# Security > Code scanning del repo. Nessun badge in README: il punteggio
# va visto prima (voce A3 del piano P43, parte 1).

name: Scorecard analysis

on:
  schedule:
    - cron: "30 1 * * 6"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
