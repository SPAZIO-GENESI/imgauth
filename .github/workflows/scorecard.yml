# OpenSSF Scorecard: valutazione automatica della postura di supply-chain
# security del repo (dipendenze pinnate, branch protection, code review,
# ecc.). Esecuzione schedulata + manuale; pubblica i risultati sull'API
# pubblica di Scorecard (api.securityscorecards.dev) e sulla scheda
# Security > Code scanning del repo. Nessun badge in README: il punteggio
# va visto prima (voce A3 del piano P43, parte 1).

name: Scorecard analysis

on:
  schedule:
    - cron: "30 1 * * 6"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
          publish_results: true

      - name: Upload SARIF results to code scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
